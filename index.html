<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>
    <div id="calc-container">
        <div id="display-container">display</div>
        <div id="button-container">
            <div id="operations">
                <button id="multiplying" onclick="multiplying()">*</button>
                <button id="dividing" onclick="dividing()">/</button>
                <button id="plus" onclick="plus()">+</button>
                <button id="result" onclick="result()">=</button>
                <button id="clear" onclick="clear()">C</button>
            </div>
            <div id="numbers">
                <button id="1" onclick="displayNumber()">1</button>
                <button id="2" onclick="displayNumber()">2</button>
                <button id="3" onclick="displayNumber()">3</button>
                <button id="4" onclick="displayNumber()">4</button>
                <button id="5" onclick="displayNumber()">5</button>
                <button id="6" onclick="displayNumber()">6</button>
                <button id="1" onclick="displayNumber()">7</button>
                <button id="1" onclick="displayNumber()">8</button>
                <button id="1" onclick="displayNumber()">9</button>
                <button id="1" onclick="displayNumber()">0</button>
            </div>

        </div>
    </div>



    <script src="index.js"></script>
</body> 
</html>
