<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>
    <div id="calc-container">
        <input id="display" readonly>
        <div id="buttons">
                <button onclick="inputs('*')" class="operators-prop">*</button>
                <button onclick="inputs('1')">1</button>
                <button onclick="inputs('2')">2</button>
                <button onclick="inputs('3')">3</button>
                <button onclick="inputs('/')" class="operators-prop">/</button>
                <button onclick="inputs('4')">4</button>
                <button onclick="inputs('5')">5</button>
                <button onclick="inputs('6')">6</button>
                <button onclick="inputs('+')" class="operators-prop">+</button>
                <button onclick="inputs('7')">7</button>
                <button onclick="inputs('8')">8</button>
                <button onclick="inputs('9')">9</button>
                <button onclick="inputs('-')" class="operators-prop">-</button>
                <button onclick="calculate()" class="operators-prop">=</button>
                <button onclick="inputs('0')">0</button>
                <button onclick="inputs('.')" class="operators-prop">.</button>
                <button onclick="clearAll()" class="operators-prop">C</button>
        </div>
    </div>



    <script src="index.js"></script>
</body> 
</html>
